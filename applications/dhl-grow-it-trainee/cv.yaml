  sections:
    summary:
      - Computational scientist (PhD) who builds software and hardware systems end to end — defining
        requirements and acceptance criteria up front, implementing and validating the solution, then
        documenting and training others to run it independently. Nine years in Python and Rust across data
        pipelines, HPC infrastructure, computer vision, and AI-assisted development (Claude Code, MCP-based
        tool integrations). Modernised legacy tooling that was then adopted team-wide. Two first-author
        Current Biology papers. Native English speaker; German B1–B2.
    experience:
      - company: MPI for Neurobiology of Behavior (caesar) / University of Bonn
        position: Doctoral Researcher
        start_date: 2019
        end_date: 2025
        location: Bonn, Germany
        highlights:
          - Designed and built a closed-loop measurement platform for freely flying Drosophila end to end;
            defined datasets, test setups, and acceptance criteria up front, then implemented multi-camera
            imaging, real-time 3D tracking, optogenetic control, and microcontroller triggering at 10 ms
            closed-loop latency.
          - Evaluated Python against the platform's timing requirements, found it insufficient, and rewrote
            the acquisition/triggering layer in Rust; validated the multi-camera 3D calibration stack
            quantitatively.
          - Built reproducible Python pipelines processing hundreds of recordings in HDF5/Parquet, run in
            parallel locally and as Slurm batch jobs; open-sourced the platform as OptoFly
            (github.com/mpinb/optofly, GPL-3.0).
          - Documented the system and shipped self-service tools so lab members without programming
            backgrounds could run analyses independently; trained and supported them; supervised one MSc
            student.
          - '**Result:** first-author paper in Current Biology (2025) on a descending neuron driving visually
            evoked flight saccades.'
      - company: Technion – Israel Institute of Technology, Faculty of Medicine
        position: MSc Researcher
        start_date: 2016
        end_date: 2018
        location: Haifa, Israel
        highlights:
          - Built MATLAB signal-processing pipelines for in vivo electrophysiology and statistics; modernised
            the lab's legacy analysis codebase and trained incoming researchers — adopted lab-wide. Also
            taught Python/ML fundamentals to non-programmer medical students (TA). Co-first-author paper in
            Current Biology (2021) on head-direction coding in the avian hippocampal formation.
