  sections:
    summary:
      - Computational scientist (PhD) who builds software and hardware systems end to end — defining
        requirements and acceptance criteria up front, implementing and validating the solution, then
        documenting and training others to run it independently. Nine years writing production research
        software in Python and Rust, across data pipelines, HPC infrastructure, computer vision, and applied
        AI/LLM-assisted development tooling (Claude Code, MCP-based tool integrations). Track record of
        modernizing legacy tooling that was then adopted team-wide, and of translating between technical
        implementation and non-technical stakeholders. Two first-author Current Biology papers. Native
        English speaker; German B1–B2.
    experience:
      - company: Max Planck Institute for Neurobiology of Behavior (caesar)
        position: Postdoctoral Researcher
        start_date: 2025-01
        end_date: 2026-01
        location: Bonn, Germany
        highlights:
          - Built imaging hardware (camera acquisition, lighting control, custom mechanical mount) and a
            Python/OpenCV/FFmpeg pipeline with a YOLO model to automate live/dead nematode scoring,
            replacing slow manual assessment — prototyped end to end within a short three-month contract;
            the classification model reached notebook-stage validation.
      - company: MPI for Neurobiology of Behavior (caesar) / University of Bonn
        position: Doctoral Researcher
        start_date: 2019
        end_date: 2025
        location: Bonn, Germany
        highlights:
          - Designed and built a closed-loop measurement platform for freely flying Drosophila end to end;
            defined datasets, test setups, and acceptance criteria up front, then implemented multi-camera
            imaging, real-time 3D tracking, optogenetic control, and microcontroller triggering, synchronised
            at 10 ms closed-loop latency.
          - Evaluated Python against the platform's timing requirements, found it insufficient, and rewrote
            the acquisition/triggering layer in Rust; kept Python for surrounding tooling and analysis.
          - Built and validated the multi-camera 3D calibration stack quantitatively (0.5 px reprojection
            error across 6 cameras at 100 fps).
          - Developed reproducible Python pipelines processing hundreds of recordings (~10 GB each,
            thousands of animals) in HDF5/Parquet, run in parallel locally and as Slurm batch jobs.
          - Documented the system and shipped self-service analysis tools so lab members without
            programming backgrounds could run standardised experiments and analyses unsupervised; trained
            and supported them. Supervised one MSc student through their thesis project.
          - '**Result:** first-author paper in Current Biology (2025) on a descending neuron driving visually
            evoked flight saccades.'
      - company: Technion – Israel Institute of Technology, Faculty of Medicine
        position: MSc Researcher
        start_date: 2016
        end_date: 2018
        location: Haifa, Israel
        highlights:
          - Built MATLAB signal-processing pipelines for in vivo electrophysiology and statistical analysis
            over large multi-dimensional datasets (~2,100 sorted units, 23 animals).
          - Modernised and extended the lab's legacy analysis codebase; documented procedures and trained
            incoming researchers — the tooling was adopted lab-wide.
          - Co-first-author paper in Current Biology (2021) on head-direction coding in the avian
            hippocampal formation.
      - company: Technion – Israel Institute of Technology, Faculty of Medicine
        position: Teaching Assistant — Machine Learning in Medical Sciences
        start_date: 2017
        end_date: 2018
        location: Haifa, Israel
        highlights:
          - Taught Python, statistics, and machine-learning fundamentals to medical students with no
            programming background.
    selected_projects:
      - name: '[OptoFly](https://github.com/mpinb/optofly) — closed-loop tracking and optogenetic
          stimulation system for freely flying Drosophila'
        start_date: 2020
        end_date: 2026
        location: public, GPL-3.0
        highlights:
          - Integrates multi-camera 3D tracking with triggered recording, optogenetic stimulation, dynamic
            autofocus, and configurable visual stimuli; Rust acquisition layer with Python bindings. 485
            commits; documented via a live docs site.
