  sections:
    summary:
      - Computational scientist (PhD) who builds software and hardware systems end to end — defining
        requirements and acceptance criteria up front, implementing and validating the solution, then
        documenting and training non-technical users to run it independently. Nine years building research
        software in Python, with Rust for real-time components, across data pipelines, HPC infrastructure,
        computer vision and applied AI. Native English speaker; German B1–B2.
    experience:
      - company: MPI for Neurobiology of Behavior / University of Bonn
        position: Doctoral Researcher — Research Software & Systems Engineering
        start_date: 2019
        end_date: 2025
        location: Bonn, Germany
        highlights:
          - Designed and built a real-time distributed measurement system end to end — defined datasets,
            test setups and acceptance criteria, then implemented multi-camera acquisition, real-time 3D
            tracking and hardware triggering at 10 ms closed-loop latency
            (applied to freely flying insects).
          - "Ran the technology evaluation for the timing-critical layer: benchmarked the Python
            implementation against the latency requirements, found it insufficient, and rewrote acquisition
            and triggering in Rust; kept Python for surrounding tooling and analysis."
          - Built reproducible data pipelines processing hundreds of recordings in HDF5/Parquet, run in
            parallel locally and as Slurm batch jobs on HPC; open-sourced the system as OptoFly
            (github.com/mpinb/optofly, GPL-3.0).
          - Owned the full lifecycle — requirements, build, validation, documentation, handover and support
            — as the interface between non-technical users and the implementation; trained colleagues to run it
            unsupervised; supervised one MSc student.
          - "**Result:** first-author paper in Current Biology (2025); the system remains in daily use as one
            of the lab's standard tools."
      - company: Technion – Israel Institute of Technology
        position: MSc Researcher — Scientific Software & Data Analysis
        start_date: 2016
        end_date: 2018
        location: Haifa, Israel
        highlights:
          - "Built MATLAB signal-processing and statistics pipelines for large datasets; modernised and
            documented the lab's legacy analysis codebase, which was then adopted lab-wide, and trained
            incoming researchers on it. Also taught Python, statistics and ML to non-programmer medical
            students (teaching assistant). Co-first-author paper in Current Biology (2021)."
    selected_projects:
      - name: Automated visual inspection pipeline — MPI for Neurobiology of Behavior
        start_date: 2025
        end_date: 2026
        location: Bonn, Germany
        highlights:
          - Built imaging hardware and an OpenCV/FFmpeg + YOLO pipeline to replace a manual visual scoring
            process; hardware, acquisition and detection ran end to end within a three-month contract,
            classification validated at notebook stage.
